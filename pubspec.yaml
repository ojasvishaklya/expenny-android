name: expenny
description: Expense Tracker
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  get: ^4.7.2
  get_storage: ^2.1.1
  sqflite: ^2.4.1
  google_nav_bar: ^5.0.6
  fl_chart: ^0.69.2
  lottie: ^3.2.0
  excel: ^2.1.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  path: ^1.9.0
  transaction_sms_parser: ^0.0.1
  another_telephony: ^0.4.1
  permission_handler: ^11.3.1
  # NOTE: SpendWidgetProvider.kt reads this plugin's SharedPreferences file
  # ("HomeWidgetPreferences") directly by name — an internal implementation
  # detail, not a public API. If bumping this major version, verify that
  # prefs file name/format hasn't changed, or the widget will silently show
  # stale/default values.
  home_widget: ^0.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  assets:
    - animations/
